[package]
name = "pskk"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "pskk"
path = "src/bin/pskk.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5.0"
tonic = "0.11"
prost = { version = "0.12", features = ["prost-derive"] }
prost-types = "0.12"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
atty = "0.2"
ibus = "0.2"
glib = "0.18"

[build-dependencies]
tonic-build = "0.11"
