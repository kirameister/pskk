[package]
name = "pskk-crf-trainer"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pskk = { path = "../../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
# Pure-Rust CRFsuite port. Pinned exactly on purpose: 5 of its 7 published
# versions have been yanked, and 0.4.x allows breaking changes. Training and
# inference were verified byte-identical / 100% label-identical against the C
# implementation for the L-BFGS configuration used here.
crfsuite-compliant-rs = { version = "=0.4.2", default-features = false }

[features]
custom-protocol = ["tauri/custom-protocol"]
